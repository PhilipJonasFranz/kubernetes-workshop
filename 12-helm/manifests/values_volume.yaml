service:
  type: LoadBalancer
  loadBalancerIP: $LOADBALANCER_RANGE_START

nextcloud:
  trustedDomains:
  # Required for K8s healthchecks to work
  - nextcloud.kube.home
  - $LOADBALANCER_RANGE_START

persistence:
  # Nextcloud files (/var/www/html)
  enabled: true
  size: 5Gi
  annotations:
    helm.sh/resource-policy: ""