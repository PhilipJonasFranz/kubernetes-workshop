apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: customaccount # Name of the target service account
    namespace: default
roleRef: # References assigned role
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io