apiVersion: v1
kind: Pod
metadata:
  name: busybox-persistent
  namespace: default
spec:
  containers:
    - name: busybox
      image: docker.io/library/busybox:stable
      command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
      volumeMounts:
        - name: data # Name of the volume defined below
          mountPath: /usr/share/ # Mount path in the container
  volumes:
    - name: data # Name to identify the volume above
      persistentVolumeClaim: # Reference existing PersistenVolumeClaim, actual storage chosen by PVC
        claimName: busybox-data