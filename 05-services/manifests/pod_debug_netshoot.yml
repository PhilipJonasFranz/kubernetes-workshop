apiVersion: v1
kind: Pod
metadata:
  name: netshoot
  namespace: default
  labels:
    app: netshoot
spec:
  containers:
    - name: netshoot
      image: docker.io/nicolaka/netshoot:latest
      # Re-writes the entrypoint to ensure pod remains running, shell
      # can only be opened into running pod
      command: ["sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]