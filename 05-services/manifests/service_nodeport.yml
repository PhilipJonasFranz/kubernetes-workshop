apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80 # Port the service is reachable internally
      targetPort: 80 # Port at the Pod where the service forwards to
      nodePort: 30080 # Port the service is externally reachable on the node IPs