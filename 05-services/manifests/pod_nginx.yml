apiVersion: v1
kind: Pod
metadata:
  name: web-1
  namespace: default
  labels:
    app: web
spec:
  initContainers:
    - name: init-content
      image: docker.io/library/busybox:stable
      command: ["sh", "-c", "echo '<h1>Hello from pod 1</h1>' > /work/index.html"]
      volumeMounts:
        - name: content
          mountPath: /work
  containers:
    - name: nginx
      image: docker.io/library/nginx:stable
      ports:
        - containerPort: 80
      volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
  volumes:
    - name: content
      emptyDir: {}
---
