apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
  labels:
    app: memory-hog
spec:
  restartPolicy: Never
  containers:
    - name: allocator
      image: docker.io/library/busybox:stable
      command:
        - sh
        - -c
        - |
          i=1
          while true; do
            dd if=/dev/zero of=/ramdisk/block-$i bs=1M count=10 2>/dev/null
            echo "belegt: $((i * 10)) MB"
            i=$((i + 1))
            sleep 1
          done
      volumeMounts:
        - name: ramdisk
          mountPath: /ramdisk
      resources:
        requests:
          memory: "32Mi"
        limits:
          memory: "64Mi" # Usage of tmpfs is capped by this limit
  volumes:
    - name: ramdisk
      emptyDir:
        medium: Memory # RAM-based tmpfs
        sizeLimit: 256Mi